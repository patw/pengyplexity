[project]
name = "pengyplexity"
version = "0.1.0"
description = "Pengyplexity — a Perplexity-style, sandboxed AI Q&A web app (Flask) built on the design of the Pengy model client + tool engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pat Wendorf", email = "dungeons@gmail.com" }]
keywords = ["ai", "llm", "web-search", "sandbox", "bubblewrap", "flask", "perplexity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "flask>=3.0",
    "moofile>=1.2.1",
    "ddgs",
    "openai>=1.0",
    "markdown>=3.4",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pengyplexity-admin = "pengyplexity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pengyplexity"]

[tool.pytest.ini_options]
testpaths = ["pengyplexity/tests"]
addopts = "-q"
